<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USER_CUE Converter — Barco Alchemy</title>
    <style>
        :root {
            --bg-base:      #080E1A;
            --bg-surface:   #0F1826;
            --bg-panel:     #141E2E;
            --bg-item:      #1A2438;
            --bg-item-alt:  #1E2A40;
            --border:       #1F3050;
            --border-bright:#2A4570;
            --barco-blue:   #0067B3;
            --barco-blue2:  #0085E0;
            --barco-orange: #E87C10;
            --text-primary: #E8EDF5;
            --text-secondary:#7A90AE;
            --text-muted:   #4A6080;
            --green:        #1FA363;
            --red:          #C0392B;
            --amber:        #B96000;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', 'Roboto', sans-serif;
            background: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            font-size: 14px;
        }

        /* ── Top nav bar ── */
        .topbar {
            background: #050B15;
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            display: flex;
            align-items: center;
            height: 52px;
            gap: 16px;
        }
        .topbar-logo {
            font-size: 1.25em;
            font-weight: 700;
            letter-spacing: 0.12em;
            color: #fff;
            text-transform: uppercase;
        }
        .topbar-logo span { color: var(--barco-blue); }
        .topbar-divider { width: 1px; height: 24px; background: var(--border); }
        .topbar-title { font-size: 0.85em; color: var(--text-secondary); letter-spacing: 0.05em; text-transform: uppercase; }
        .topbar-badge {
            margin-left: auto;
            background: var(--barco-blue);
            color: #fff;
            font-size: 0.75em;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 2px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        /* ── Header image area ── */
        .header-img { width: 100%; display: block; border-bottom: 2px solid var(--barco-blue); }
        .header-img img { width: 100%; height: auto; display: block; }

        /* ── Page layout ── */
        .page { max-width: 1200px; margin: 0 auto; padding: 28px 24px; }

        /* ── Step panel ── */
        .panel {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-left: 3px solid var(--barco-blue);
            margin-bottom: 20px;
        }
        .panel-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 18px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-surface);
        }
        .step-num {
            width: 24px; height: 24px;
            background: var(--barco-blue);
            color: #fff;
            font-size: 0.8em;
            font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            border-radius: 2px;
            flex-shrink: 0;
        }
        .panel-title {
            font-size: 0.9em;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-primary);
        }
        .panel-body { padding: 18px; }

        /* ── Drop zone ── */
        .drop-zone {
            border: 1px dashed var(--barco-blue);
            background: var(--bg-item);
            padding: 28px;
            text-align: center;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }
        .drop-zone:hover, .drop-zone.drag-over {
            background: #0D1E38;
            border-color: var(--barco-blue2);
        }
        .drop-zone-icon { font-size: 2em; margin-bottom: 8px; opacity: 0.6; }
        .drop-zone p { color: var(--text-secondary); font-size: 0.9em; margin-bottom: 6px; pointer-events: none; }
        .drop-zone input[type="file"] { display: none; }
        .drop-zone label { cursor: pointer; color: var(--barco-blue2); font-weight: 600; }
        .drop-zone label:hover { color: #fff; text-decoration: underline; }
        .file-name {
            margin-top: 10px;
            font-size: 0.85em;
            color: var(--barco-orange);
            font-weight: 600;
            letter-spacing: 0.03em;
        }

        /* ── Buttons ── */
        button {
            padding: 9px 22px;
            font-size: 0.85em;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
            border-radius: 2px;
            margin: 4px;
            transition: background 0.15s, opacity 0.15s;
        }
        .btn-analyze { background: var(--green); color: #fff; }
        .btn-analyze:hover:not(:disabled) { background: #25BB72; }
        .btn-convert { background: var(--barco-blue); color: #fff; }
        .btn-convert:hover:not(:disabled) { background: var(--barco-blue2); }
        .btn-download { background: var(--barco-blue); color: #fff; }
        .btn-download:hover:not(:disabled) { background: var(--barco-blue2); }
        .btn-copy { background: transparent; color: var(--barco-orange); border: 1px solid var(--barco-orange); }
        .btn-copy:hover:not(:disabled) { background: rgba(232,124,16,0.1); }
        .btn-small {
            padding: 6px 14px;
            font-size: 0.8em;
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-bright);
        }
        .btn-small:hover { background: var(--bg-item); color: var(--text-primary); }
        button:disabled { opacity: 0.35 !important; cursor: not-allowed; }

        /* ── Status bar ── */
        #statusMessage { min-height: 0; overflow: hidden; transition: all 0.2s; }
        .status-success {
            display: flex; align-items: center; gap: 10px;
            background: rgba(31,163,99,0.12);
            border-left: 3px solid var(--green);
            color: #4BD393;
            padding: 10px 16px;
            margin: 12px 0;
            font-size: 0.88em;
        }
        .status-error {
            display: flex; align-items: center; gap: 10px;
            background: rgba(232,124,16,0.1);
            border-left: 3px solid var(--barco-orange);
            color: var(--barco-orange);
            padding: 10px 16px;
            margin: 12px 0;
            font-size: 0.88em;
        }

        /* ── Toolbar (selection controls) ── */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 0 12px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .toolbar-count {
            font-size: 0.85em;
            color: var(--text-secondary);
            margin-right: 4px;
        }
        .toolbar-count strong { color: var(--barco-orange); }

        /* ── Search ── */
        .search-wrap { position: relative; margin-bottom: 12px; }
        .search-wrap input {
            width: 100%;
            background: var(--bg-item);
            border: 1px solid var(--border-bright);
            color: var(--text-primary);
            padding: 9px 14px 9px 36px;
            font-size: 0.88em;
            outline: none;
            border-radius: 2px;
        }
        .search-wrap input:focus { border-color: var(--barco-blue); }
        .search-wrap input::placeholder { color: var(--text-muted); }
        .search-icon {
            position: absolute; left: 12px; top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted); font-size: 0.9em;
            pointer-events: none;
        }

        /* ── Macro list ── */
        .macro-list {
            max-height: 440px;
            overflow-y: auto;
            border: 1px solid var(--border);
            background: var(--bg-surface);
        }
        .macro-list::-webkit-scrollbar { width: 6px; }
        .macro-list::-webkit-scrollbar-track { background: var(--bg-surface); }
        .macro-list::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 3px; }

        .macro-item {
            display: flex;
            align-items: flex-start;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.1s;
        }
        .macro-item:last-child { border-bottom: none; }
        .macro-item:hover { background: var(--bg-item); }
        .macro-item.selected {
            background: rgba(0,103,179,0.15);
            border-bottom-color: rgba(0,103,179,0.2);
        }
        .macro-item.selected .macro-name { color: #60AFEE; }

        .macro-checkbox {
            margin-right: 12px;
            margin-top: 2px;
            width: 16px; height: 16px;
            flex-shrink: 0;
            accent-color: var(--barco-blue);
            cursor: pointer;
        }
        .macro-name {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.92em;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }
        .macro-details { font-size: 0.8em; color: var(--text-muted); margin-top: 3px; font-family: 'Consolas', monospace; }
        .command-count {
            background: var(--barco-orange);
            color: #fff;
            padding: 1px 8px;
            border-radius: 2px;
            font-size: 0.75em;
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        /* ── Output ── */
        .output-box {
            background: #060D18;
            border: 1px solid var(--border);
            padding: 16px;
            max-height: 380px;
            overflow-y: auto;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.82em;
            white-space: pre-wrap;
            color: #7EC8E3;
            line-height: 1.6;
        }
        .output-box::-webkit-scrollbar { width: 6px; }
        .output-box::-webkit-scrollbar-track { background: #060D18; }
        .output-box::-webkit-scrollbar-thumb { background: var(--border-bright); }

        .output-actions { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 12px; }

        /* ── Warnings box ── */
        .warnings-box {
            background: rgba(185,96,0,0.08);
            border: 1px solid rgba(232,124,16,0.4);
            border-left: 3px solid var(--barco-orange);
            padding: 14px 16px;
            margin-top: 14px;
        }
        .warnings-box h4 {
            color: var(--barco-orange);
            font-size: 0.85em;
            font-weight: 700;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .warnings-box ul { margin-left: 18px; }
        .warnings-box li { color: #C89050; font-size: 0.84em; margin-bottom: 4px; }

        /* ── Divider ── */
        .section-divider {
            height: 1px;
            background: var(--border);
            margin: 24px 0;
        }
    </style>
</head>
<body>

    <!-- Top navigation bar -->
    <div class="topbar">
        <div class="topbar-logo">B<span>ARCO</span></div>
        <div class="topbar-divider"></div>
        <div class="topbar-title">Alchemy &mdash; USER_CUE Converter</div>
        <div class="topbar-badge">Doremi ⇄ Alkemy</div>
    </div>

    <!-- Optional header image -->
    <div class="header-img">
        <img src="top.png" alt="" onerror="this.parentElement.style.display='none'">
    </div>

    <div class="page">

        <div id="statusMessage"></div>

        <!-- Step 1: Load file -->
        <div class="panel">
            <div class="panel-header">
                <div class="step-num">1</div>
                <div class="panel-title">Load Automation File</div>
            </div>
            <div class="panel-body">
                <div class="drop-zone" id="dropZone">
                    <div class="drop-zone-icon">&#128450;</div>
                    <p>Drag &amp; drop the XML file here, or</p>
                    <label for="fileInput">browse from computer</label>
                    <input type="file" id="fileInput" accept=".xml" />
                    <div class="file-name" id="fileNameDisplay"></div>
                </div>
                <div style="margin-top:12px">
                    <button class="btn-analyze" id="analyzeBtn" onclick="analyzeFile()" disabled>&#9654; Analyze File</button>
                </div>
            </div>
        </div>

        <!-- Step 2: Select macros -->
        <div class="panel" id="selectionSection" style="display:none">
            <div class="panel-header">
                <div class="step-num">2</div>
                <div class="panel-title">Select Automation Cues</div>
            </div>
            <div class="panel-body">
                <div class="toolbar">
                    <span class="toolbar-count"><strong id="selectedCount">0</strong> selected &nbsp;/&nbsp; <strong id="totalCount">0</strong> total</span>
                    <button class="btn-small" onclick="selectAll()">Select All</button>
                    <button class="btn-small" onclick="deselectAll()">Deselect All</button>
                </div>
                <div class="search-wrap">
                    <span class="search-icon">&#128269;</span>
                    <input type="text" id="searchInput" placeholder="Search cue name..." onkeyup="filterMacros()">
                </div>
                <div class="macro-list" id="macroList"></div>
                <div style="margin-top:14px">
                    <button class="btn-convert" id="convertBtn" onclick="convertSelected()" disabled>&#9889; Convert Selected</button>
                </div>
            </div>
        </div>

        <!-- Step 3: Result -->
        <div class="panel" id="outputSection" style="display:none">
            <div class="panel-header">
                <div class="step-num">3</div>
                <div class="panel-title">Conversion Output</div>
            </div>
            <div class="panel-body">
                <div id="outputBox" class="output-box"></div>
                <div class="output-actions">
                    <button class="btn-download" onclick="downloadFile()">&#11015; Download XML</button>
                    <button class="btn-copy" onclick="copyToClipboard()">&#128203; Copy to Clipboard</button>
                </div>
                <div id="warningsBox" style="display:none" class="warnings-box">
                    <h4>&#9888; Conversion Warnings</h4>
                    <ul id="warningsList"></ul>
                </div>
            </div>
        </div>

    </div>

    <div style="text-align:center; padding: 18px 0 28px; color: var(--text-muted); font-size: 0.78em; letter-spacing: 0.08em; text-transform: uppercase;">
        Made by <span style="color: var(--barco-orange); font-weight: 600;">Rocco Totaro</span>
    </div>

    <script>
let convertedContent = '', fileName = '', fileType = '', allMacros = [];

// ── Drag & drop ──────────────────────────────────────────────
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');

dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file) setFile(file);
});
dropZone.addEventListener('click', e => {
    if (e.target.tagName !== 'LABEL' && e.target !== fileInput) fileInput.click();
});
fileInput.addEventListener('change', function() {
    if (this.files && this.files.length) setFile(this.files[0]);
});

function setFile(file) {
    const dt = new DataTransfer();
    dt.items.add(file);
    fileInput.files = dt.files;
    document.getElementById('fileNameDisplay').textContent = '📄 ' + file.name;
    document.getElementById('analyzeBtn').disabled = false;
    document.getElementById('selectionSection').style.display = 'none';
    document.getElementById('outputSection').style.display = 'none';
    allMacros = []; fileType = '';
}

// ── Status ───────────────────────────────────────────────────
function showStatus(message, isError = false) {
    const statusDiv = document.getElementById('statusMessage');
    statusDiv.className = isError ? 'status-error' : 'status-success';
    statusDiv.textContent = message;
    setTimeout(() => statusDiv.textContent = '', 5000);
}

// ── Analisi file ─────────────────────────────────────────────
function analyzeFile() {
    if (!fileInput.files || !fileInput.files.length) {
        showStatus('❌ Seleziona prima un file!', true);
        return;
    }
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const xmlText = e.target.result;
            const parser = new DOMParser();
            const doc = parser.parseFromString(xmlText, 'text/xml');
            if (doc.querySelector('parsererror')) throw new Error('XML non valido o malformato');

            if (doc.querySelector('AutomationCueMacro')) {
                fileType = 'doremi';
                allMacros = extractDoremiMacros(doc);
                showStatus(`✅ Doremi: ${allMacros.length} macro trovate`);
            } else if (doc.querySelectorAll('Event[Source="USER_CUE"]').length) {
                fileType = 'alkemy';
                const events = Array.from(doc.querySelectorAll('Event[Source="USER_CUE"]'));
                allMacros = extractAlkemyMacros(events);
                showStatus(`✅ Alkemy: ${allMacros.length} USER_CUE trovate`);
            } else {
                throw new Error('Nessuna macro trovata (né Doremi né Alkemy)');
            }

            displayMacros();
            document.getElementById('selectionSection').style.display = 'block';
        } catch (error) {
            showStatus(`❌ Errore: ${error.message}`, true);
            console.error('Errore:', error);
        }
    };
    reader.readAsText(fileInput.files[0]);
}

// ── Estrazione macro ─────────────────────────────────────────
function extractDoremiMacros(doc) {
    return Array.from(doc.querySelectorAll('AutomationCueMacro')).map((element, index) => {
        const name = element.querySelector('Name')?.textContent.trim() || `Macro_${index + 1}`;
        const commands = element.querySelectorAll('Command');
        const commandDetails = [];
        commands.forEach(cmd => {
            const type = cmd.querySelector('Type')?.textContent.trim() || '';
            const value = cmd.querySelector('Value')?.textContent.trim();
            const device = cmd.querySelector('DeviceName')?.textContent.trim();
            let detail = type;
            if (value) detail += ' = ' + value;
            if (device) detail += ' (' + device + ')';
            if (detail) commandDetails.push(detail);
        });
        return { index, name, commandCount: commands.length, commandDetails, element };
    });
}

function extractAlkemyMacros(events) {
    return events.map((element, index) => {
        const name = element.getAttribute('Name') || `Cue_${index + 1}`;
        const actions = element.querySelectorAll('Action');
        const actionDetails = [];
        actions.forEach(action => {
            actionDetails.push(`${action.getAttribute('Target')}: ${action.getAttribute('Name')}`);
        });
        return { index, name, commandCount: actions.length, commandDetails: actionDetails, element };
    });
}

// ── Display macro ────────────────────────────────────────────
function displayMacros() {
    const macroList = document.getElementById('macroList');
    macroList.innerHTML = '';
    document.getElementById('totalCount').textContent = allMacros.length;
    document.getElementById('selectedCount').textContent = '0';

    allMacros.forEach((macro, index) => {
        const item = document.createElement('div');
        item.className = 'macro-item';
        item.dataset.index = index;

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'macro-checkbox';
        checkbox.id = `macro-${index}`;
        checkbox.onchange = updateSelection;

        const infoDiv = document.createElement('div');
        infoDiv.style.flex = '1';

        const nameDiv = document.createElement('div');
        nameDiv.className = 'macro-name';
        nameDiv.textContent = macro.name;

        const countSpan = document.createElement('span');
        countSpan.className = 'command-count';
        countSpan.textContent = `${macro.commandCount} comandi`;
        nameDiv.appendChild(countSpan);

        infoDiv.appendChild(nameDiv);
        if (macro.commandDetails.length > 0) {
            const detailsDiv = document.createElement('div');
            detailsDiv.className = 'macro-details';
            detailsDiv.textContent = macro.commandDetails.join(' | ');
            infoDiv.appendChild(detailsDiv);
        }

        item.appendChild(checkbox);
        item.appendChild(infoDiv);
        item.onclick = function(e) {
            if (e.target !== checkbox) { checkbox.checked = !checkbox.checked; updateSelection(); }
        };

        macroList.appendChild(item);
    });
}

function updateSelection() {
    let selectedCount = 0;
    document.querySelectorAll('.macro-checkbox').forEach(checkbox => {
        const item = checkbox.closest('.macro-item');
        if (checkbox.checked) { selectedCount++; item.classList.add('selected'); }
        else { item.classList.remove('selected'); }
    });
    document.getElementById('selectedCount').textContent = selectedCount;
    document.getElementById('convertBtn').disabled = selectedCount === 0;
}

function selectAll() {
    document.querySelectorAll('.macro-checkbox').forEach(cb => {
        if (cb.closest('.macro-item').style.display !== 'none') cb.checked = true;
    });
    updateSelection();
}

function deselectAll() {
    document.querySelectorAll('.macro-checkbox').forEach(cb => {
        if (cb.closest('.macro-item').style.display !== 'none') cb.checked = false;
    });
    updateSelection();
}

function filterMacros() {
    const searchTerm = document.getElementById('searchInput').value.toLowerCase();
    document.querySelectorAll('.macro-item').forEach(item => {
        const name = item.textContent.toLowerCase();
        item.style.display = name.includes(searchTerm) ? 'flex' : 'none';
    });
}

// ── Conversione ───────────────────────────────────────────────
function convertSelected() {
    const selectedIndices = Array.from(document.querySelectorAll('.macro-checkbox:checked'))
        .map(cb => parseInt(cb.closest('.macro-item').dataset.index));

    if (!selectedIndices.length) {
        showStatus('❌ Seleziona almeno una macro!', true);
        return;
    }

    const selectedMacros = selectedIndices.map(i => allMacros[i]);

    try {
        let result;
        if (fileType === 'doremi') {
            result = convertDoremiToAlkemy(selectedMacros);
            fileName = 'ICMPSettings_converted.xml';
        } else {
            result = convertAlkemyToDoremi(selectedMacros);
            fileName = 'macros_converted.xml';
        }

        convertedContent = result.xml;
        document.getElementById('outputBox').textContent = convertedContent;
        document.getElementById('outputSection').style.display = 'block';

        const warningsBox  = document.getElementById('warningsBox');
        const warningsList = document.getElementById('warningsList');
        if (result.warnings.length > 0) {
            warningsList.innerHTML = result.warnings.map(w => `<li>${w}</li>`).join('');
            warningsBox.style.display = 'block';
            showStatus(`⚠️ Conversione con ${result.warnings.length} avviso/i — controlla la sezione gialla`, true);
        } else {
            warningsBox.style.display = 'none';
            showStatus(`✅ Conversione completata! ${selectedIndices.length} macro`);
        }

        document.getElementById('outputSection').scrollIntoView({ behavior: 'smooth' });
    } catch (error) {
        showStatus(`❌ Errore: ${error.message}`, true);
    }
}

function escapeXml(text) {
    if (!text) return '';
    return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&apos;');
}

function convertDoremiToAlkemy(selectedMacros) {
    const warnings = [];
    let xml = '<?xml version="1.0"?>\n<SmsSettings version="1.1">\n  <Automation>\n    <Events>\n';

    selectedMacros.forEach(macro => {
        xml += `      <Event Source="USER_CUE" Name="${escapeXml(macro.name)}">\n`;

        macro.element.querySelectorAll('Command').forEach(cmd => {
            const type   = cmd.querySelector('Type')?.textContent.trim();
            const value  = cmd.querySelector('Value')?.textContent.trim();
            const device = cmd.querySelector('DeviceName')?.textContent.trim();
            const line   = cmd.querySelector('Line')?.textContent.trim() || '0';
            const pulse  = cmd.querySelector('PulseDelay')?.textContent.trim() || '1000';
            const msg    = cmd.querySelector('Message')?.textContent || '';

            if (type === 'Play')
                xml += `        <Action Target="PLAYER" Name="Play" DelayInMilliseconds="0"/>\n`;
            else if (type === 'Stop')
                xml += `        <Action Target="PLAYER" Name="Stop" DelayInMilliseconds="0"/>\n`;
            else if (type === 'Pause')
                xml += `        <Action Target="PLAYER" Name="Pause" DelayInMilliseconds="0"><Parameter Name="Duration in Minutes" Value="0"/></Action>\n`;
            else if (type === 'Lamp')
                xml += `        <Action Target="PROJECTOR" Name="${value === 'On' ? 'Turn Lamp On' : 'Turn Lamp Off'}" DelayInMilliseconds="0"/>\n`;
            else if (type === 'Dowser')
                xml += `        <Action Target="PROJECTOR" Name="${value === 'On' ? 'Close Dowser' : 'Open Dowser'}" DelayInMilliseconds="0"/>\n`;
            else if (type === 'ProjectorMacro')
                xml += `        <Action Target="PROJECTOR" Name="Execute Macro" DelayInMilliseconds="0"><Parameter Value="${escapeXml(value||'')}"/></Action>\n`;
            else if (type === 'GPO')
                xml += `        <Action Target="GPIO" Name="Pulse Up" DelayInMilliseconds="0"><Parameter Name="Output" Value="${line}"/><Parameter Name="Duration in Milliseconds" Value="${pulse}"/></Action>\n`;
            else if (type === 'DeviceRawSendMessage' && device)
                xml += `        <Action Target="${escapeXml(device)}" Name="Send Text" DelayInMilliseconds="0"><Parameter Name="Text" Value="${escapeXml(msg.replace(/\\r\\n/g, '\\0D\\0A '))}"/></Action>\n`;
            else if (type) {
                xml += `        <!-- IGNORATO: tipo "${escapeXml(type)}"${device ? ` su ${escapeXml(device)}` : ''} -->\n`;
                warnings.push(`[${macro.name}] Tipo non convertibile ignorato: "${type}"${device ? ` (dispositivo: ${device})` : ''}`);
            }
        });

        xml += `      </Event>\n`;
    });

    xml += '    </Events>\n  </Automation>\n</SmsSettings>';
    return { xml, warnings };
}

function convertAlkemyToDoremi(selectedMacros) {
    const warnings = [];
    let xml = '<?xml version="1.0"?>\n<AutomationCueMacroList>\n';
    xml += '  <IssueDate>' + new Date().toISOString() + '</IssueDate>\n';
    xml += '  <Issuer>Doremi Cinema LLC</Issuer>\n  <Creator>Convertitore</Creator>\n';
    xml += '  <AnnotationText>Convertito da formato Alkemy</AnnotationText>\n';

    selectedMacros.forEach(macro => {
        const event = macro.element;
        xml += `  <AutomationCueMacro>\n    <Name>${escapeXml(macro.name)}</Name>\n`;
        xml += `    <Id>urn:uuid:${crypto.randomUUID()}</Id>\n    <CommandList>\n`;

        event.querySelectorAll('Action').forEach(action => {
            const target     = action.getAttribute('Target');
            const actionName = action.getAttribute('Name');
            const params     = action.querySelectorAll('Parameter');

            if (target === 'PLAYER' && (actionName === 'Play' || actionName === 'Start'))
                xml += '      <Command>\n        <Type>Play</Type>\n      </Command>\n';
            else if (target === 'PLAYER' && actionName === 'Stop')
                xml += '      <Command>\n        <Type>Stop</Type>\n      </Command>\n';
            else if (target === 'PLAYER' && actionName === 'Pause') {
                const durParam = Array.from(params).find(p => p.getAttribute('Name') === 'Duration in Minutes');
                const dur = durParam ? parseFloat(durParam.getAttribute('Value') || '0') : 0;
                xml += '      <Command>\n        <Type>Pause</Type>\n      </Command>\n';
                if (dur > 0)
                    warnings.push(`[${macro.name}] Pausa temporizzata (${dur} min con ripresa automatica) → convertita in Pausa semplice (Doremi non supporta auto-ripresa)`);
            }
            else if (target === 'PLAYER' && actionName === 'Resume') {
                xml += `      <!-- IGNORATO: PLAYER/Resume non ha equivalente Doremi -->\n`;
                warnings.push(`[${macro.name}] "Resume" (PLAYER) non ha un equivalente in Doremi — azione ignorata`);
            }
            else if (target === 'PROJECTOR' && actionName === 'Turn Lamp On')
                xml += '      <Command>\n        <Type>Lamp</Type>\n        <Value>On</Value>\n        <DeviceName>DLP Projector</DeviceName>\n      </Command>\n';
            else if (target === 'PROJECTOR' && actionName === 'Turn Lamp Off')
                xml += '      <Command>\n        <Type>Lamp</Type>\n        <Value>Off</Value>\n        <DeviceName>DLP Projector</DeviceName>\n      </Command>\n';
            else if (target === 'PROJECTOR' && actionName === 'Close Dowser')
                xml += '      <Command>\n        <Type>Dowser</Type>\n        <Value>On</Value>\n        <DeviceName>DLP Projector</DeviceName>\n      </Command>\n';
            else if (target === 'PROJECTOR' && actionName === 'Open Dowser')
                xml += '      <Command>\n        <Type>Dowser</Type>\n        <Value>Off</Value>\n        <DeviceName>DLP Projector</DeviceName>\n      </Command>\n';
            else if (target === 'PROJECTOR' && actionName === 'Execute Macro') {
                const macroVal = Array.from(params).find(p => p.hasAttribute('Value'))?.getAttribute('Value') || '';
                xml += `      <Command>\n        <Type>ProjectorMacro</Type>\n        <Value>${escapeXml(macroVal)}</Value>\n        <DeviceName>DLP Projector</DeviceName>\n      </Command>\n`;
            }
            else if (target === 'GPIO' && actionName === 'Pulse Up') {
                let line = '0', dur = '1000';
                params.forEach(p => {
                    if (p.getAttribute('Name') === 'Output') line = p.getAttribute('Value');
                    if (p.getAttribute('Name') === 'Duration in Milliseconds') dur = p.getAttribute('Value');
                });
                xml += `      <Command>\n        <Type>GPO</Type>\n        <Line>${line}</Line>\n        <Value>2</Value>\n        <PulseDelay>${dur}</PulseDelay>\n      </Command>\n`;
            }
            else if (actionName === 'Send Text') {
                // Gestione generica dispositivi TCP (CP650, CP750, CP850, QSC, ecc.)
                let txt = '';
                params.forEach(p => { if (p.getAttribute('Name') === 'Text') txt = p.getAttribute('Value'); });
                txt = txt.replace(/\\0D\\0A/g, '\\r\\n').trim();
                xml += `      <Command>\n        <Type>DeviceRawSendMessage</Type>\n        <DeviceName>${escapeXml(target)}</DeviceName>\n        <MessageType>text</MessageType>\n        <Message>${escapeXml(txt)}</Message>\n      </Command>\n`;
            }
            else if (target && actionName) {
                xml += `      <!-- IGNORATO: ${escapeXml(target)}/${escapeXml(actionName)} -->\n`;
                warnings.push(`[${macro.name}] Azione non convertibile ignorata: "${target}/${actionName}"`);
            }
        });

        xml += '    </CommandList>\n  </AutomationCueMacro>\n';
    });

    xml += '</AutomationCueMacroList>';
    return { xml, warnings };
}

// ── Download & copia ─────────────────────────────────────────
function downloadFile() {
    if (!convertedContent) { showStatus('❌ Nessun contenuto!', true); return; }
    const blob = new Blob([convertedContent], { type: 'application/xml' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fileName;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showStatus('✅ File scaricato!');
}

function copyToClipboard() {
    if (!convertedContent) { showStatus('❌ Nessun contenuto!', true); return; }
    navigator.clipboard.writeText(convertedContent)
        .then(() => showStatus('✅ Copiato negli appunti!'))
        .catch(() => showStatus('❌ Impossibile copiare', true));
}
