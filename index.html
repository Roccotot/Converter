<!DOCTYPE html>

<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIGRA FILM - Convertitore USER_CUE</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Segoe UI;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:20px}
.container{max-width:1400px;margin:auto;background:#fff;border-radius:15px;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}

.header{background:#000;color:#fff;text-align:center;padding:30px}
.header h1{font-size:2.8em;letter-spacing:2px}
.header p{opacity:.8}

.content{padding:40px}

input[type=file]{width:100%;padding:15px;border:2px dashed #667eea;border-radius:8px;margin-bottom:20px}

button{padding:14px 25px;border:0;border-radius:8px;font-weight:600;cursor:pointer;margin:5px}
.btn{background:#667eea;color:#fff}
.btn-green{background:#2ecc71;color:#fff}
.btn-blue{background:#3498db;color:#fff}

.macro-list{max-height:500px;overflow:auto;border:2px solid #eee;border-radius:8px;padding:10px}
.macro-item{display:flex;padding:12px;margin-bottom:8px;background:#f5f5f5;border-radius:8px;cursor:pointer}
.macro-item.selected{background:#dfefff;border:2px solid #3498db}

.macro-name{font-size:1.25em;font-weight:700}
.macro-details{font-size:.85em;color:#666;margin-top:4px}

.tag{padding:3px 8px;border-radius:10px;color:#fff;font-size:.7em;margin-left:8px}
.play{background:#27ae60}
.lamp{background:#f39c12}
.gpio{background:#e74c3c}
.audio{background:#9b59b6}

.output-box{background:#111;color:#0f0;padding:20px;font-family:monospace;max-height:400px;overflow:auto;border-radius:8px;margin-top:20px}
</style>

</head>

<body>
<div class="container">
<div class="header">
<h1>🎬 SIGRA FILM</h1>
<p>Convertitore Doremi ⇄ Alkemy USER_CUE</p>
</div>

<div class="content">

<h2>1. Carica XML</h2>
<input type="file" id="fileInput" accept=".xml">
<button class="btn-green" onclick="analyze()">Analizza file</button>

<div id="sel" style="display:none">
<h2>2. Seleziona macro</h2>
<div id="macroList" class="macro-list"></div>
<button class="btn" onclick="convert()">Converti</button>
</div>

<div id="out" style="display:none">
<h2>3. Risultato</h2>
<div id="output" class="output-box"></div>
<button class="btn-blue" onclick="download()">Scarica XML</button>
</div>

</div>
</div>

<script>
let macros=[]
let type=""
let result=""
let outName="converted.xml"

function analyze(){
const file=document.getElementById("fileInput").files[0]
if(!file)return
const r=new FileReader()

r.onload=e=>{
const txt=e.target.result

if(txt.includes("<AutomationCueMacro>")){
type="doremi"
parseDoremi(txt)
}else{
type="alkemy"
parseAlkemy(txt)
}

draw()
document.getElementById("sel").style.display="block"
}
r.readAsText(file)
}

function parseDoremi(xml){
macros=[]
const reg=/<AutomationCueMacro>([\s\S]*?)<\/AutomationCueMacro>/g
let m,i=0
while((m=reg.exec(xml))){
let block=m[1]
let name=(block.match(/<n>(.*?)<\/n>/)||[])[1]||("Macro_"+(i+1))
let cmds=[...block.matchAll(/<Type>(.*?)<\/Type>/g)].map(x=>x[1])
macros.push({name,cmds,xml:m[0]})
i++
}
}

function parseAlkemy(xml){
const p=new DOMParser()
const doc=p.parseFromString(xml,"text/xml")
const ev=[...doc.querySelectorAll('Event[Source="USER_CUE"]')]
macros=[]
ev.forEach(e=>{
let name=e.getAttribute("Name")
let cmds=[...e.querySelectorAll("Action")].map(a=>a.getAttribute("Name"))
macros.push({name,cmds,el:e})
})
}

function icon(c){
c=c.toLowerCase()
if(c.includes("play"))return "🎬"
if(c.includes("lamp"))return "💡"
if(c.includes("gpio"))return "⚡"
if(c.includes("audio"))return "🔊"
return "⚙️"
}

function tag(c){
c=c.toLowerCase()
if(c.includes("play"))return "play"
if(c.includes("lamp"))return "lamp"
if(c.includes("gpio"))return "gpio"
if(c.includes("audio"))return "audio"
return ""
}

function draw(){
const box=document.getElementById("macroList")
box.innerHTML=""

macros.forEach((m,i)=>{
const row=document.createElement("div")
row.className="macro-item"

const cb=document.createElement("input")
cb.type="checkbox"
cb.style.marginRight="10px"

const info=document.createElement("div")

let first=m.cmds[0]||m.name
let big=document.createElement("div")
big.className="macro-name"
big.innerHTML=icon(first)+" "+first+
` <span class="tag ${tag(first)}">${m.cmds.length}</span>`

let small=document.createElement("div")
small.className="macro-details"
small.textContent="Macro: "+m.name

info.appendChild(big)
info.appendChild(small)

if(m.cmds.length>1){
let rest=document.createElement("div")
rest.className="macro-details"
rest.textContent=m.cmds.slice(1).join(" | ")
info.appendChild(rest)
}

row.appendChild(cb)
row.appendChild(info)
row.onclick=()=>cb.checked=!cb.checked

box.appendChild(row)
})
}

function convert(){
const checks=[...document.querySelectorAll(".macro-item input:checked")]
if(!checks.length)return

if(type==="doremi"){
result=toAlkemy(checks)
outName="ICMPSettings.xml"
}else{
result=toDoremi(checks)
outName="macros.xml"
}

document.getElementById("out").style.display="block"
document.getElementById("output").textContent=result
}

function toAlkemy(sel){
let xml='<?xml version="1.0"?><SmsSettings><Automation><Events>'
sel.forEach(c=>{
let i=[...document.querySelectorAll(".macro-item input")].indexOf(c)
let m=macros[i]
xml+=`<Event Source="USER_CUE" Name="${m.name}">`
m.cmds.forEach(cmd=>{
if(cmd==="Play")xml+=`<Action Target="PLAYER" Name="Play"/>`
if(cmd==="Pause")xml+=`<Action Target="PLAYER" Name="Pause"/>`
if(cmd==="Lamp")xml+=`<Action Target="PROJECTOR" Name="Turn Lamp On"/>`
})
xml+='</Event>'
})
xml+='</Events></Automation></SmsSettings>'
return xml
}

function toDoremi(sel){
let xml='<?xml version="1.0"?><AutomationCueMacroList>'
sel.forEach(c=>{
let i=[...document.querySelectorAll(".macro-item input")].indexOf(c)
let m=macros[i]
xml+=`<AutomationCueMacro><n>${m.name}</n><CommandList>`
m.cmds.forEach(cmd=>{
xml+=`<Command><Type>${cmd}</Type></Command>`
})
xml+='</CommandList></AutomationCueMacro>'
})
xml+='</AutomationCueMacroList>'
return xml
}

function download(){
const blob=new Blob([result],{type:"text/xml"})
const a=document.createElement("a")
a.href=URL.createObjectURL(blob)
a.download=outName
a.click()
}
</script>

</body>
</html>
